# Build jobs run inside the CUDA devel container so both runner arches
# pin the identical toolkit; the smoke job runs on the bare runner, which
# has neither a GPU nor a CUDA install, to prove the binary links no CUDA
# library. GPU-backed tests are skipped via GIT_BREW_SKIP_GPU_TESTS
# and stay a manual pre-release step on real hardware.
#
# The conda job builds the same source with conda-forge's toolchain, whose
# glibc 2.28 sysroot is what lets the package run on older distributions
# than the runner. It is also the only Windows build: conda-forge supplies
# the Visual Studio activation and the CUDA toolkit that a bare Windows
# runner lacks, and the package test confirms the program starts with no
# CUDA runtime DLL present. Tagged releases publish those packages to
# prefix.dev through trusted publishing: the job's OIDC token is the
# credential, so the repository holds no API key.

name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    # By digest of the multi-arch index, so both runners pull the same
    # release; the toolkit version is chosen by hand, not by Dependabot.
    container: nvidia/cuda:13.0.3-devel-ubuntu24.04@sha256:b7ae301dea2c162444795462ce17a05f6a516e5a75944b57af5b88540a1a2266
    steps:
      # Before the checkout: without git in the image, actions/checkout
      # falls back to a source archive with no repository to list files from.
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git curl ca-certificates \
            python3-pip
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # rustup-init at a fixed release, checked against the digest
        # published with it. The toolchain itself is the one
        # rust-toolchain.toml names.
        env:
          RUSTUP_INIT_RELEASE: 1.29.3
        run: |
          case "$(uname -m)" in
            x86_64) sha=b1c8cb14e30889e7e2999e6b69e62d9e9b9ffc0f4df8180564d306d9680e6c55 ;;
            aarch64) sha=9f608c142e0e38a78957d0661ba1dfaf0b6fb37184cfaa4b9a0aa57af6184282 ;;
          esac
          curl -sSfo rustup-init \
            "https://static.rust-lang.org/rustup/archive/$RUSTUP_INIT_RELEASE/$(uname -m)-unknown-linux-gnu/rustup-init"
          echo "$sha  rustup-init" | sha256sum -c -
          chmod +x rustup-init
          ./rustup-init -y --profile minimal --default-toolchain none
          rm rustup-init
          "$HOME/.cargo/bin/rustup" toolchain install
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Format check
        run: cargo fmt --check
      - name: C++ format check
        # The same release as the local toolchain; clang-format reflows
        # code between releases, so any other version makes the gate flaky.
        shell: bash # pipefail, so a failed file listing fails the step
        run: |
          pip3 install --quiet --break-system-packages 'clang-format==19.1.7'
          # The container runs as root over a workspace the runner user
          # owns, which git refuses to read without this.
          git -c safe.directory="$GITHUB_WORKSPACE" ls-files \
            'native/*.h' 'native/*.hpp' 'native/*.cpp' 'native/*.cu' \
            | xargs clang-format --dry-run --Werror
      - name: Native tests
        # Explicit arch: the CMakeLists fallback is `native`, which needs
        # a visible GPU to detect. The kernel image still compiles here;
        # the tests themselves are host-only.
        run: |
          cmake -S native -B native-ci -G Ninja \
            -DBUILD_TESTING=ON -DCMAKE_CUDA_ARCHITECTURES=75-real
          cmake --build native-ci
          ctest --test-dir native-ci --output-on-failure
      - name: Rust tests, GPU subset skipped
        # --nocapture keeps the guards' "skipping:" lines in the log, so a
        # green run still shows which tests did not actually search.
        run: cargo test --release --locked -- --nocapture
        env:
          GIT_BREW_SKIP_GPU_TESTS: "1"
      - name: Clippy
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Strip release binary
        run: |
          cargo build --release --locked
          strip target/release/git-brew
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: git-brew-linux-${{ matrix.arch }}
          path: target/release/git-brew

  smoke:
    needs: build
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64 }
          - { runner: ubuntu-24.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: git-brew-linux-${{ matrix.arch }}
      - name: Binary loads and runs without CUDA
        run: |
          chmod +x git-brew
          ldd ./git-brew
          ! ldd ./git-brew | grep -iE 'cuda|stdc\+\+'
          ./git-brew --version

  conda:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-64 }
          - { runner: ubuntu-24.04-arm, platform: linux-aarch64 }
          - { runner: windows-2025, platform: win-64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Release tag matches the package version
        # The version is written in both Cargo.toml and the recipe; a tag
        # that disagrees with either would publish a mislabelled package.
        # The files are the same on every runner, and a Windows checkout
        # may convert them to CRLF, which the exact-line match would miss.
        if: github.ref_type == 'tag' && runner.os == 'Linux'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          ver="${TAG#v}"
          grep -qx "version = \"$ver\"" Cargo.toml ||
            { echo "::error::Cargo.toml is not at version $ver"; exit 1; }
          grep -qx "  version: \"$ver\"" recipe/recipe.yaml ||
            { echo "::error::recipe/recipe.yaml is not at version $ver"; exit 1; }
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: v0.80.0
          recipe-path: recipe/recipe.yaml
          artifact-name: conda-${{ matrix.platform }}

  publish:
    if: github.ref_type == 'tag'
    needs: [build, smoke, conda]
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # trusted publishing to prefix.dev
    env:
      PREFIX_CHANNEL: biscuitvixen/biscuitvixen # namespace/channel
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: conda-*
          merge-multiple: true
          path: output
      - uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          rattler-build-version: v0.80.0
          setup-only: "true"
      - name: Upload to prefix.dev
        # --skip-existing lets a re-run of a partly published tag finish
        # instead of failing on the packages already there.
        run: |
          find output -name '*.conda' -print0 |
            xargs -0 rattler-build upload prefix --skip-existing

  release:
    if: github.ref_type == 'tag'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: git-brew-linux-*
      - name: Package tarballs
        run: |
          ver="${GITHUB_REF_NAME#v}"
          for arch in x86_64 aarch64; do
            chmod +x "git-brew-linux-$arch/git-brew"
            tar -C "git-brew-linux-$arch" -czf \
              "git-brew-$ver-linux-$arch.tar.gz" git-brew
          done
      - name: Publish the GitHub release
        # A re-run after a partial upload finds the release already made,
        # so it replaces the assets rather than failing on create.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" git-brew-*.tar.gz --clobber
          else
            gh release create "$GITHUB_REF_NAME" git-brew-*.tar.gz \
              --verify-tag --notes ""
          fi
