# `cargo release <patch|minor|major> --execute` bumps the version in
# Cargo.toml, Cargo.lock and the recipe, commits and tags. Pushing stays
# a separate step.
allow-branch = ["main"]
pre-release-commit-message = "Release {{version}}"
tag-message = "git-brew {{version}}"
push = false
pre-release-replacements = [
  { file = "recipe/recipe.yaml", search = '  version: "[0-9.]+"', replace = '  version: "{{version}}"', exactly = 1 },
  # A new version starts its conda build count again.
  { file = "recipe/recipe.yaml", search = 'number: [0-9]+', replace = 'number: 0', exactly = 1 },
]
