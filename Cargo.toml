[package]
name = "git-brew"
version = "0.1.0"
edition = "2021"
description = "Give a git commit hash a chosen prefix by brute-force search on the GPU"
license = "MIT"
# Needs a CUDA toolkit to build, so it ships as conda packages and
# release binaries rather than through crates.io.
publish = false

[[bin]]
name = "git-brew"
path = "src/main.rs"

[dependencies]
ctrlc = "3"

[build-dependencies]
cmake = "0.1"
