# Keep in step with Cargo.toml; CI refuses a release tag that disagrees
# with either.
context:
  version: "0.1.1"

package:
  name: git-brew
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  skip:
    - not (linux or win)
    - cuda_compiler_version == "None"
  script:
    # conda's nvcc activation exports a default CUDAARCHS, which build.rs
    # honours as an override. Unset, CMake ships its own arch list.
    - if: unix
      then: unset CUDAARCHS
      else: set "CUDAARCHS="
    - cargo-bundle-licenses --format yaml --output THIRDPARTY.yml
    # Windows packages keep their programs under Library\bin.
    - if: unix
      then: cargo install --locked --no-track --bins --root ${{ PREFIX }} --path .
      else: cargo install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ compiler("cxx") }}
    - ${{ compiler("cuda") }}
    - ${{ compiler("rust") }}
    - ${{ stdlib("c") }}
    - cargo-bundle-licenses
    - cmake
    - ninja
  # Nothing from the toolkit is linked: the kernel image is embedded and
  # the driver's own library is opened at run time. The headers nvcc
  # includes arrive with the compiler package. cuda-version stays,
  # carrying the __cuda driver floor.
  host:
    - cuda-version ==${{ cuda_compiler_version }}
  # nvcc needs a host C++ compiler to preprocess the kernel, but no C++
  # ends up in the executable, so the compiler's libstdc++ run export
  # would be a dependency the program never loads.
  ignore_run_exports:
    by_name:
      - libstdcxx

tests:
  - script:
      - git-brew --version
      - git-brew --help
  - package_contents:
      bin:
        - git-brew

about:
  homepage: https://github.com/biscuitvixen/git-brew
  repository: https://github.com/biscuitvixen/git-brew
  summary: Give a git commit hash a chosen prefix by brute-force search on the GPU
  license: MIT
  license_file:
    - LICENSE
    - THIRDPARTY.yml

extra:
  recipe-maintainers:
    - biscuitvixen
